<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị Viettel Phú Hà</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f4f7f6;color:#163d34}button,input,select,textarea{font:inherit;border:1px solid #d9e2df;border-radius:7px;padding:12px;min-height:46px}input,select,textarea{width:100%;margin-top:6px;background:white}textarea{min-height:85px;resize:vertical}label{display:block;margin:12px 0}button{background:#e6002d;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.outline{background:white;color:#075039}.panel{background:white;border:1px solid #e1e8e5;border-radius:10px;padding:20px;margin-bottom:16px}.wrap{max-width:1100px;margin:auto;padding:20px}h1{font-size:26px}h2{font-size:21px}header{background:#003d31;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:22px}.tabs{display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#f4f7f6;padding:10px 0;z-index:2}.tabs select{max-width:400px;margin:0}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.red{color:#e6002d}.muted{color:#61736e;font-size:14px}.status{background:#edf5f1;padding:6px 10px;border-radius:15px;font-size:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.head h3{margin:0}.record p{overflow-wrap:anywhere;white-space:pre-wrap}.record details{margin-top:12px}summary{cursor:pointer;color:#cf0027;min-height:44px;padding:12px 0;font-weight:bold}.notice{background:#fff7e8;border:1px solid #efdab3;padding:14px}.error{color:#b00020;white-space:pre-wrap;overflow-wrap:anywhere}.success{color:#096b3f}#login-panel{max-width:460px;margin:30px auto}a{color:#007151}#message{position:sticky;top:0;z-index:3;display:none;padding:14px;background:#e6f6ec}#message.visible{display:block}small{display:block;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px}.settings{max-width:750px}.checks{display:flex;align-items:center;gap:10px}.checks input{width:20px;height:20px;min-height:20px;margin:0}form button{min-width:130px}.pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:650px){.wrap{padding:12px}.panel{padding:15px}.grid{grid-template-columns:1fr;gap:0}header strong{font-size:18px}header button{padding:10px}.tabs{gap:8px}.tabs select{min-width:0;flex:1;width:0}.tabs button{font-size:14px}.head h3{font-size:18px}.pagination button{font-size:14px}h1{font-size:24px}}
</style></head><body><header><strong>Viettel Phú Hà · Quản trị</strong><button class="outline" id="logout" hidden>Đăng xuất</button></header><div id="message" role="status"></div><main id="root" class="wrap"></main>
<script>
const root=document.getElementById('root');
const escapeText=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('vi-VN')+' đ';
const labels={available:'Còn hàng',reserved:'Đang giữ chỗ',sold:'Đã bán',hidden:'Ẩn',new:'Mới',contacted:'Đã liên hệ',done:'Đã xử lý'};
let token='',data,tab='leads',page=1,query='',statusFilter='',refreshTimer,busy=false;
function rpc(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Không thể kết nối Google Sheets.')))[name](...args));}
function message(text,error=false){const el=document.getElementById('message');el.textContent=text;el.className='visible'+(error?' error':'');clearTimeout(message.timer);message.timer=setTimeout(()=>el.className='',7000);}
function login(){clearInterval(refreshTimer);document.getElementById('logout').hidden=true;root.innerHTML=`<section class="panel" id="login-panel"><h1>Đăng nhập cửa hàng</h1><p>Dùng mật khẩu được tạo khi thiết lập Apps Script.</p><form id="login-form"><label>Mật khẩu quản trị<input type="password" name="password" required autocomplete="current-password"></label><p class="error" role="alert"></p><button>Đăng nhập</button></form><small>Quên mật khẩu: chủ Google Sheet chạy hàm resetAdminPassword trong Apps Script để tạo mật khẩu mới.</small></section>`;root.querySelector('form').onsubmit=e=>submit(e,async values=>{const response=await rpc('adminLogin',values.password);token=response.token;await reload();document.getElementById('logout').hidden=false;refreshTimer=setInterval(async()=>{if(busy||!token)return;try{const fresh=await rpc('adminData',token);data=fresh;const el=document.getElementById('new-count');if(el)el.textContent=data.leads.filter(l=>l.status==='new').length+' khách mới cần gọi';}catch(e){clearInterval(refreshTimer);message(e.message,true);}},60000);});}
async function submit(e,fn){e.preventDefault();const form=e.currentTarget;const err=form.querySelector('.error');if(err)err.textContent='';const button=form.querySelector('button[type=submit],button:not([type])');button.disabled=true;busy=true;try{await fn(Object.fromEntries(new FormData(form)),form);}catch(error){if(err){err.textContent=error.message;err.scrollIntoView({block:'center'});}else message(error.message,true);}finally{busy=false;if(button.isConnected)button.disabled=false;}}
async function reload(){data=await rpc('adminData',token);render();}
const input=(name,label,value='',type='text',required=false)=>`<label>${label}<input name="${name}" type="${type}" value="${escapeText(value)}" ${required?'required':''}></label>`;
const options=(name,label,values,value='')=>`<label>${label}<select name="${name}">${values.map(([v,t])=>`<option value="${escapeText(v)}" ${String(v)===String(value)?'selected':''}>${escapeText(t)}</option>`).join('')}</select></label>`;
const note=(name,label,value='')=>`<label>${label}<textarea name="${name}">${escapeText(value)}</textarea></label>`;
const branches=()=>data.settings.branches.map(b=>[b.id,b.name+' — '+b.address]);
function simForm(s={}){return `<form class="sim-form" data-id="${s.id||''}"><div class="grid">${input('number','Số sim (10 số)',s.number||'','tel',true)}${input('price','Giá (đồng)',s.price||'','number',true)}${input('type','Loại sim',s.type||'Sim số đẹp','text',true)}${options('branch','Cơ sở',branches(),s.branch||'cs1')}${options('status','Tình trạng',['available','reserved','sold','hidden'].map(s=>[s,labels[s]]),s.status||'available')}${options('element','Ngũ hành',[['','Chưa phân loại'],...['Kim','Mộc','Thủy','Hỏa','Thổ'].map(s=>[s,s])],s.element||'')}</div>${note('description','Mô tả',s.description)}<label class="checks"><input type="checkbox" name="featured" ${s.featured?'checked':''}>Sim nổi bật</label><p class="error" role="alert"></p><button>${s.id?'Lưu sim':'Thêm sim'}</button></form>`;}
function simCard(s){return `<article class="panel record"><div class="head"><h3>${escapeText(s.number)}</h3><b class="red">${money(s.price)}</b><span class="status">${escapeText(labels[s.status])}</span></div><p>${escapeText(s.type)} · ${escapeText(s.branch.toUpperCase())}</p><details><summary>Sửa giá / tình trạng sim</summary>${simForm(s)}</details></article>`;}
function leadCard(l){return `<article class="panel record"><div class="head"><h3>${escapeText(l.name)}</h3><span class="status">${escapeText(labels[l.status])}</span></div><p><a href="tel:${escapeText(l.phone)}">☎ ${escapeText(l.phone)}</a> · ${escapeText(l.branch.toUpperCase())}</p><p>${l.sim_number?`Sim khách chọn: <b>${escapeText(l.sim_number)}</b> · ${money(l.quoted_price)}`:'Tư vấn chung'}</p><small>${new Date(Number(l.created)*1000).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})}</small><p>${escapeText(l.message)}</p>${l.follow_up?`<p>Hẹn gọi: ${escapeText(l.follow_up.replace('T',' '))}</p>`:''}<details><summary>Ghi chú / cập nhật tư vấn</summary><form class="lead-form" data-id="${escapeText(l.id)}">${options('status','Trạng thái',['new','contacted','done'].map(s=>[s,labels[s]]),l.status)}${input('follow_up','Hẹn gọi lại (giờ Việt Nam)',l.follow_up,'datetime-local')}${note('staff_note','Ghi chú của cửa hàng',l.staff_note)}<p class="error" role="alert"></p><button>Lưu tư vấn</button></form></details></article>`;}
function settingsView(){const c=data.settings;return `<h1>Cấu hình cửa hàng</h1><form id="settings-form" class="panel settings">${input('name','Tên cửa hàng',c.name,'text',true)}${input('phone','Hotline',c.phone,'tel',true)}${input('email','Email',c.email,'email',true)}${input('tagline','Thông điệp',c.tagline)}${input('hours','Giờ mở cửa',c.hours)}${input('site_url','Tên miền HTTPS',c.site_url,'url')}${input('zalo_url','Link Zalo chính thức',c.zalo_url,'url')}${input('banner_url','Link ảnh banner HTTPS (nếu có)',c.banner_url,'url')}${note('privacy_policy','Chính sách sử dụng tên/số điện thoại để gọi tư vấn',c.privacy_policy)}<small>Điền chính sách này để mở biểu mẫu khách. Nêu mục đích gọi tư vấn, người truy cập, thời gian lưu và cách yêu cầu sửa/xóa.</small>${note('registration_policy','Hướng dẫn đăng ký chính chủ (tùy chọn)',c.registration_policy)}<p class="error" role="alert"></p><button>Lưu cấu hình</button></form>`;}
function render(){const newCount=data.leads.filter(l=>l.status==='new').length;root.innerHTML=`<div class="head"><p id="new-count">${newCount} khách mới cần gọi</p><small>${data.sims.length} sim trong kho</small></div><div class="tabs"><select id="tab" aria-label="Chức năng"><option value="leads">Khách cần tư vấn</option><option value="sims">Kho sim</option><option value="settings">Cấu hình cửa hàng</option></select><button class="outline" id="refresh">Làm mới</button></div><div id="content"></div>`;document.getElementById('tab').value=tab;document.getElementById('tab').onchange=e=>{tab=e.target.value;query='';statusFilter='';page=1;render();};document.getElementById('refresh').onclick=async e=>{e.target.disabled=true;try{await reload();}catch(error){message(error.message,true);}finally{e.target.disabled=false;}};const content=document.getElementById('content');if(tab==='settings'){content.innerHTML=settingsView();}else{const sims=tab==='sims';const statuses=sims?['available','reserved','sold','hidden']:['new','contacted','done'];const list=data[tab].filter(r=>(!statusFilter||r.status===statusFilter)&&(!query||String(sims?r.number:[r.name,r.phone,r.sim_number].join(' ')).toLowerCase().includes(query.toLowerCase()))).slice().reverse();content.innerHTML=`<h1>${sims?'Kho sim':'Khách cần tư vấn'}</h1>${sims?`<details class="panel"><summary>+ Thêm sim</summary>${simForm()}</details><details class="panel"><summary>Nhập danh sách sim từ Excel / CSV</summary><p>Tải mẫu, điền sim và lưu CSV UTF-8. Hoặc sao chép bảng Excel có dòng tiêu đề vào ô dưới.</p><button type="button" class="outline" id="template">Tải mẫu CSV</button><form id="import-form"><label>Chọn tệp CSV<input name="file" type="file" accept=".csv,text/csv"></label>${note('csv','Hoặc dán bảng từ Excel')}<small>Cột: number, price, type, branch. Số sim giữ đủ 10 số, cơ sở cs1/cs2/cs3. Nếu có lỗi/trùng, toàn bộ chưa được nhập.</small><p class="error" role="alert"></p><button>Nhập danh sách</button></form></details>`:''}<form id="filter" class="panel"><div class="grid">${input('query',sims?'Tìm số sim':'Tên / điện thoại / sim',query)}${options('status','Trạng thái',[['','Tất cả'],...statuses.map(s=>[s,labels[s]])],statusFilter)}</div><button>Lọc</button></form><div class="actions"><button class="outline" id="export">Xuất CSV</button></div><p>${list.length} bản ghi</p>${list.slice((page-1)*20,page*20).map(sims?simCard:leadCard).join('')||'<p class="panel">Chưa có dữ liệu phù hợp.</p>'}<div class="pagination"><button id="prev" class="outline" ${page<=1?'disabled':''}>← Trước</button><span>${page} / ${Math.max(1,Math.ceil(list.length/20))}</span><button id="next" class="outline" ${page*20>=list.length?'disabled':''}>Tiếp →</button></div>`;document.getElementById('filter').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.currentTarget));query=values.query;statusFilter=values.status;page=1;render();};document.getElementById('prev').onclick=()=>{page--;render();window.scrollTo(0,0);};document.getElementById('next').onclick=()=>{page++;render();window.scrollTo(0,0);};document.getElementById('export').onclick=()=>{const headers=sims?['number','price','type','branch','status','element','description']:['id','name','phone','sim_number','quoted_price','branch','message','status','staff_note','follow_up'];download(sims?'kho-sim.csv':'khach-tu-van.csv',toCsv(headers,data[tab]));};}
root.querySelectorAll('.sim-form').forEach(f=>f.onsubmit=e=>submit(e,async(d,form)=>{d.id=form.dataset.id?Number(form.dataset.id):undefined;d.featured=form.elements.featured.checked;await rpc('adminSaveSim',token,d);await reload();message('Đã lưu sim');}));root.querySelectorAll('.lead-form').forEach(f=>f.onsubmit=e=>submit(e,async(d,form)=>{d.id=form.dataset.id;await rpc('adminSaveLead',token,d);await reload();message('Đã lưu tư vấn');}));const sf=document.getElementById('settings-form');if(sf)sf.onsubmit=e=>submit(e,async d=>{await rpc('adminSettings',token,d);await reload();message('Đã lưu cấu hình. Tải lại website để xem thay đổi.');});const importer=document.getElementById('import-form');if(importer)importer.onsubmit=e=>submit(e,async(d,f)=>{const file=f.elements.file.files[0];if(file&&file.size>1024*1024)throw new Error('Tệp tối đa 1 MB.');const text=file?await file.text():d.csv;if(!text.trim())throw new Error('Chọn CSV hoặc dán bảng Excel.');const result=await rpc('adminImport',token,parseTable(text));await reload();message('Đã nhập '+result.count+' sim');});const template=document.getElementById('template');if(template)template.onclick=()=>download('mau-sim.csv','\ufeffnumber,price,type,branch,status,element,description\r\n');}
function parseTable(text){text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/)[0];const separator=first.includes('\t')?'\t':first.includes(',')?',':';';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else if(quoted)quoted=false;else if(!cell)quoted=true;else throw new Error('Dấu nháy CSV không hợp lệ.');}else if(!quoted&&(c===separator||c==='\n'||c==='\r')){row.push(cell);cell='';if(c!==separator){if(c==='\r'&&text[i+1]==='\n')i++;if(row.some(x=>x.trim()))rows.push(row);row=[];}}else cell+=c;}if(quoted)throw new Error('CSV có dấu nháy chưa đóng.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);const headers=(rows.shift()||[]).map(x=>x.trim().toLowerCase());if(!['number','price','type','branch'].every(h=>headers.includes(h)))throw new Error('Thiếu cột number, price, type hoặc branch.');if(new Set(headers).size!==headers.length)throw new Error('Tiêu đề cột bị trùng.');return rows.map((r,i)=>{if(r.length!==headers.length)throw new Error('Dòng '+(i+2)+' có số cột không đúng.');return Object.fromEntries(headers.map((h,j)=>[h,r[j].trim()]));});}
function toCsv(headers,rows){const quote=v=>'"'+String(v??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"';return '\ufeff'+[headers.map(quote).join(','),...rows.map(r=>headers.map(h=>quote(r[h])).join(','))].join('\r\n');}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.getElementById('logout').onclick=async()=>{try{await rpc('adminLogout',token);}catch{}token='';data=null;login();};
login();
</script></body></html>
