services:
  web:
    build: .
    image: viettel-phuha:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATA_DIR: /data
      SECURE_COOKIES: "1"
      # Use only behind the single trusted HTTPS reverse proxy described in DEPLOYMENT.md.
      TRUST_PROXY: "1"
    volumes:
      - store-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  mail-worker:
    image: viettel-phuha:local
    profiles: ["mail"]
    restart: unless-stopped
    command: ["python", "server.py", "mail-worker"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - store-data:/data
volumes:
  store-data:
